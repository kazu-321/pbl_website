<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07101f">

  <title>綺矢李射くん</title>

  <link rel="stylesheet" href="./style.css?v=20260626-2">
</head>

<body>

  <div class="app">

    <!-- ヘッダー -->
    <header class="header">

      <div class="time">
        <span id="current-time"></span>
        <span class="current-date" id="current-date"></span>
      </div>

      <div class="title-area">
        <h1>綺矢李射くん</h1>
        <p>Autonomous Robot</p>
      </div>

      <div class="status">
        <span class="online-dot"></span>
        <p id="connection-status">...</p>
      </div>

    </header>

    <!-- メニューボタン -->
    <button class="menu-btn" id="menu-btn" aria-label="メニューを開く" aria-expanded="false">
      ☰
    </button>

    <!-- 背景の暗くなる部分 -->
    <div class="menu-overlay" id="menu-overlay"></div>

    <!-- サイドメニュー -->
    <nav class="side-menu" id="side-menu">

      <h2>メニュー</h2>

      <div class="menu-item">⚙ 設定</div>
      <div class="menu-item">📍 目的地履歴</div>
      <div class="menu-item">🕒 走行履歴</div>

      <div class="theme-area">

        <p class="theme-title">画面テーマ</p>

        <button class="theme-toggle" id="theme-toggle">
          ☀ ホワイトモード
        </button>

      </div>
    </nav>

    <!-- メイン -->
    <main class="main">

      <!-- マップ -->
      <section class="map-panel glass">
        <canvas id="canvas"></canvas>
        <button class="map-location-btn" aria-label="現在地を表示">
          ◎
        </button>

      </section>

      <!-- PCでは右側、スマホでは下から出るボトムシート -->
      <aside class="side" id="bottom-sheet" aria-label="操作パネル">

        <!-- スマホだけ表示するドラッグ部分 -->
        <div class="sheet-drag-area" id="sheet-drag-area" aria-label="操作パネルを開閉">
          <span class="sheet-handle"></span>
        </div>

        <!-- スマホの閉じた状態で見える概要 -->
        <div class="sheet-summary">

          <div class="sheet-summary-text">
            <p class="sheet-eyebrow">選択中の目的地</p>
            <h2 id="selected-destination">読み込み中...</h2>
            <p>
              <span id="selected-time">--</span>
              <span>・68m</span>
            </p>
          </div>

          <button class="sheet-toggle" id="sheet-toggle" type="button" aria-expanded="false">
            詳細
          </button>

        </div>

        <div class="side-cards">

          <!-- 目的地 -->
          <div class="card glass destination-card">

            <h2>目的地を選択</h2>

            
            <!-- 目的地ボタンは goal.js が manifest.json から自動生成します -->
            <p id="destination-loading">目的地を読み込み中...</p>

          </div>

          <!-- ルート情報 -->
          <div class="card glass">

            <h2>ルート情報</h2>

            <div class="info-grid">

              <div>
                <p class="label">到着予想</p>
                <p class="value">1分20秒</p>
              </div>

              <div>
                <p class="label">距離</p>
                <p class="value">68m</p>
              </div>

              <div>
                <p class="label">進行状況</p>
                <p class="value">65%</p>
              </div>

            </div>

          </div>

          <!-- ロボット状態 -->
          <div class="card glass">

            <h2>ロボットの状態</h2>

            <div class="info-grid">

              <div>
                <p class="label">速度</p>
                <p class="value">1.2 m/s</p>
              </div>

              <div>
                <p class="label">バッテリー</p>
                <p class="value">82%</p>
              </div>

              <div>
                <p class="label">接続状態</p>
                <p class="value green">良好</p>
              </div>

            </div>

          </div>

        </div>

        <!-- PCではマップ下、スマホではボトムシート下部 -->
        <div class="controls">

          <button class="control-btn stop" id="power-toggle-btn" type="button">
            一時停止
          </button>

          <button class="control-btn start" id="auto-toggle-btn" type="button">
            ▶ 自動運転を開始
          </button>

        </div>

      </aside>

    </main>

  </div>

  <script>
    function updateTime() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      const month = now.getMonth() + 1;
      const date = now.getDate();

      const week = ["日", "月", "火", "水", "木", "金", "土"];
      const day = week[now.getDay()];

      document.getElementById("current-time").textContent = `${hours}:${minutes}`;
      document.getElementById("current-date").textContent = `${month}月${date}日(${day})`;
    }

    updateTime();
    setInterval(updateTime, 1000);

    // サイドメニューの開閉
    const menuBtn = document.getElementById("menu-btn");
    const sideMenu = document.getElementById("side-menu");
    const menuOverlay = document.getElementById("menu-overlay");

    function closeMenu() {
      sideMenu.classList.remove("show");
      menuOverlay.classList.remove("show");
      menuBtn.setAttribute("aria-expanded", "false");
    }

    menuBtn.addEventListener("click", function () {
      const willOpen = !sideMenu.classList.contains("show");
      sideMenu.classList.toggle("show", willOpen);
      menuOverlay.classList.toggle("show", willOpen);
      menuBtn.setAttribute("aria-expanded", String(willOpen));
    });

    menuOverlay.addEventListener("click", closeMenu);

    // テーマ切り替え
    const themeToggle = document.getElementById("theme-toggle");
    const rootElement = document.documentElement;
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');

    themeToggle.addEventListener("click", function () {
      const isLightMode = !document.body.classList.contains("light-mode");

      // bodyだけでなくhtmlにも付けて、画面外や余白も確実に切り替える
      document.body.classList.toggle("light-mode", isLightMode);
      rootElement.classList.toggle("light-mode", isLightMode);

      themeToggle.textContent = isLightMode
        ? "🌙 ダークモード"
        : "☀ ホワイトモード";

      // スマホのブラウザ上部などの色もテーマに合わせる
      themeColorMeta?.setAttribute(
        "content",
        isLightMode ? "#f3f6fb" : "#07101f"
      );
    });

    // スマホ用ボトムシート
    const bottomSheet = document.getElementById("bottom-sheet");
    const sheetDragArea = document.getElementById("sheet-drag-area");
    const sheetSummary = document.querySelector(".sheet-summary");
    const sheetToggle = document.getElementById("sheet-toggle");
    const sheetSwipeAreas = [sheetDragArea, sheetSummary];
    const mobileMedia = window.matchMedia("(max-width: 900px)");

    let isDragging = false;
    let activeSwipeArea = null;
    let startY = 0;
    let startOffset = 0;
    let currentOffset = 0;

    function getClosedOffset() {
      const visibleHeight = 142;
      return Math.max(0, bottomSheet.offsetHeight - visibleHeight);
    }

    function setSheetExpanded(expanded) {
      bottomSheet.classList.toggle("is-expanded", expanded);
      bottomSheet.style.removeProperty("transform");
      bottomSheet.classList.remove("is-dragging");
      sheetToggle.textContent = expanded ? "閉じる" : "詳細";
      sheetToggle.setAttribute("aria-expanded", String(expanded));
      document.body.classList.toggle("sheet-expanded", expanded);
    }

    function resetSheetForViewport() {
      if (!mobileMedia.matches) {
        setSheetExpanded(false);
        bottomSheet.style.removeProperty("transform");
      }
    }

    sheetToggle.addEventListener("click", () => {
      setSheetExpanded(!bottomSheet.classList.contains("is-expanded"));
    });

    function startSheetDrag(event) {
      if (!mobileMedia.matches) return;

      // 「詳細」ボタンなどの操作を邪魔しない
      if (event.target.closest("button")) return;

      isDragging = true;
      activeSwipeArea = event.currentTarget;
      startY = event.clientY;
      startOffset = bottomSheet.classList.contains("is-expanded")
        ? 0
        : getClosedOffset();
      currentOffset = startOffset;

      bottomSheet.classList.add("is-dragging");
      activeSwipeArea.setPointerCapture(event.pointerId);
    }

    function moveSheetDrag(event) {
      if (!isDragging || !mobileMedia.matches) return;

      const maxOffset = getClosedOffset();
      const moved = event.clientY - startY;
      currentOffset = Math.min(maxOffset, Math.max(0, startOffset + moved));

      bottomSheet.style.transform = `translateY(${currentOffset}px)`;
    }

    function finishSheetDrag(event) {
      if (!isDragging) return;

      isDragging = false;
      const movedDistance = Math.abs(event.clientY - startY);
      const maxOffset = getClosedOffset();

      if (activeSwipeArea?.hasPointerCapture(event.pointerId)) {
        activeSwipeArea.releasePointerCapture(event.pointerId);
      }
      activeSwipeArea = null;

      if (movedDistance < 6) {
        setSheetExpanded(!bottomSheet.classList.contains("is-expanded"));
        return;
      }

      setSheetExpanded(currentOffset < maxOffset * 0.55);
    }

    // ハンドルだけでなく、閉じた状態で見えている概要部分全体からスワイプできる
    sheetSwipeAreas.forEach(area => {
      area.addEventListener("pointerdown", startSheetDrag);
      area.addEventListener("pointermove", moveSheetDrag);
      area.addEventListener("pointerup", finishSheetDrag);
      area.addEventListener("pointercancel", finishSheetDrag);
    });

    window.addEventListener("resize", resetSheetForViewport);
    resetSheetForViewport();
  </script>

    <script src="./scripts/roslib.js"> </script>
    <script src="./scripts/map.js"> </script>
    <script src="./scripts/path.js"> </script>
    <script src="./scripts/goal.js"></script>
    <script src="./scripts/pose.js"></script>
    <script src="./scripts/controller.js"></script>
    <script src="./scripts/script.js"> </script>
</body>

</html>
