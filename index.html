<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>綺矢李射くん</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ヘッダー -->
    <header class="header">

      <div class="time" id="current-time"></div>

      <div class="title-area">
        <h1>綺矢李射くん</h1>
        <p>Autonomous Robot</p>
      </div>

      <div class="status">
        <span class="online-dot"></span>
        ONLINE
      </div>

    </header>

    <!-- メニューボタン -->
    <button class="menu-btn" id="menu-btn">
      ☰
    </button>

    <!-- 背景の暗くなる部分 -->
    <div class="menu-overlay" id="menu-overlay"></div>

    <!-- サイドメニュー -->
    <nav class="side-menu" id="side-menu">

      <h2>メニュー</h2>

      <div class="menu-item">⚙ 設定</div>
      <div class="menu-item">📍 目的地履歴</div>
      <div class="menu-item">🕒 走行履歴</div>

      <div class="theme-area">

        <p class="theme-title">画面テーマ</p>

        <button class="theme-toggle" id="theme-toggle">
          ☀ ホワイトモード
        </button>

      </div>
    </nav>

    <!-- メイン -->
    <main class="main">

      <!-- 左エリア -->
      <div class="left-area">

        <!-- マップ -->
        <section class="map-panel glass">

          <div class="map">
            MAP
          </div>

        </section>

        <!-- 下ボタン -->
        <div class="controls">

          <button class="control-btn stop">
            一時停止
          </button>

          <button class="control-btn start">
            ▶ 自動運転を開始
          </button>

          <button class="control-btn emergency" id="emergency-btn">
            緊急停止
          </button>

        </div>

      </div>

      <!-- 右 -->
      <aside class="side">

        <!-- 目的地 -->
        <div class="card glass">

          <h2>目的地を選択</h2>

          <div class="destination active">
            <span>4F</span>
            <span>約1分</span>
          </div>

          <div class="destination">
            <span>5F</span>
            <span>約1分</span>
          </div>

          <div class="destination">
            <span>男子トイレ</span>
            <span>約1分</span>
          </div>

          <div class="destination">
            <span>女子トイレ</span>
            <span>約1分</span>
          </div>

          <div class="destination">
            <span>松崎先生 教員室</span>
            <span>約2分</span>
          </div>

        </div>

        <!-- ルート情報 -->
        <div class="card glass">

          <h2>ルート情報</h2>

          <div class="info-grid">

            <div>
              <p class="label">到着予想</p>
              <p class="value">1分20秒</p>
            </div>

            <div>
              <p class="label">距離</p>
              <p class="value">68m</p>
            </div>

            <div>
              <p class="label">進行状況</p>
              <p class="value">65%</p>
            </div>

          </div>

        </div>

        <!-- ロボット状態 -->
        <div class="card glass">

          <h2>ロボットの状態</h2>

          <div class="info-grid">

            <div>
              <p class="label">速度</p>
              <p class="value">1.2 m/s</p>
            </div>

            <div>
              <p class="label">バッテリー</p>
              <p class="value">82%</p>
            </div>

            <div>
              <p class="label">接続状態</p>
              <p class="value green">良好</p>
            </div>

          </div>

        </div>

      </aside>

    </main>

  </div>

  <!-- 緊急停止確認モーダル -->
  <div class="modal" id="emergency-modal">

    <div class="modal-box glass">

      <h2>緊急停止しますか？</h2>

      <p>ロボットをただちに停止します。</p>

      <div class="modal-buttons">

        <button class="modal-btn cancel" id="cancel-emergency">
          いいえ
        </button>

        <button class="modal-btn confirm" id="confirm-emergency">
          はい
        </button>

      </div>

    </div>

  </div>

  <script>
    function updateTime() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      const month = now.getMonth() + 1;
      const date = now.getDate();

      const week = ["日", "月", "火", "水", "木", "金", "土"];
      const day = week[now.getDay()];

      document.getElementById("current-time").textContent =
        `${hours}:${minutes}　${month}月${date}日(${day})`;
    }

    updateTime();
    setInterval(updateTime, 1000);

    //緊急停止
    const emergencyBtn = document.getElementById("emergency-btn");
    const emergencyModal = document.getElementById("emergency-modal");
    const cancelEmergency = document.getElementById("cancel-emergency");
    const confirmEmergency = document.getElementById("confirm-emergency");

    emergencyBtn.addEventListener("click", function () {
      emergencyModal.classList.add("show");
    });

    cancelEmergency.addEventListener("click", function () {
      emergencyModal.classList.remove("show");
    });

    confirmEmergency.addEventListener("click", function () {
      emergencyModal.classList.remove("show");
    });

    // ボタンの色の切り替え
    const destinations = document.querySelectorAll(".destination");

    destinations.forEach(destination => {

      destination.addEventListener("click", () => {

        // 全部のactiveを消す
        destinations.forEach(item => {
          item.classList.remove("active");
        });

        // クリックしたやつだけactive
        destination.classList.add("active");

      });

    });

    // サイドメニューの開閉
    const menuBtn = document.getElementById("menu-btn");
    const sideMenu = document.getElementById("side-menu");
    const menuOverlay = document.getElementById("menu-overlay");

    menuBtn.addEventListener("click", function () {
      sideMenu.classList.toggle("show");
      menuOverlay.classList.toggle("show");
    });

    menuOverlay.addEventListener("click", function () {
      sideMenu.classList.remove("show");
      menuOverlay.classList.remove("show");
    });

    // テーマ切り替え
    const themeToggle = document.getElementById("theme-toggle");

    themeToggle.addEventListener("click", function () {

      document.body.classList.toggle("light-mode");

      if (document.body.classList.contains("light-mode")) {
        themeToggle.textContent = "🌙 ダークモード";
      } else {
        themeToggle.textContent = "☀ ホワイトモード";
      }

    });
  </script>


</body>

</html>
